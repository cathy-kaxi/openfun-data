name: Sync Genspicy to Google Sheets

on:
  push:
    branches: [main]
    paths: [genspicy_data.json]
  workflow_dispatch:
  schedule:
    - cron: '5 3 * * *'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install google-api-python-client google-auth
      - name: Run genspicy sync
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
        run: python update_genspicy.py
      - name: Commit debug output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add genspicy_debug.json
          git diff --staged --quiet || git commit -m "chore: update genspicy debug [skip ci]"
          git push
