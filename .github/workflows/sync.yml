name: Sync to Google Sheets

on:
  push:
    branches: [main]
    paths: [data.json]
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install google-api-python-client google-auth
      - name: Debug secret
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
        run: |
          echo "GOOGLE_CREDENTIALS length: ${{ env.GOOGLE_CREDENTIALS != '' }}"
      - name: Run sync
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
          SPREADSHEET_ID: 19NnLZAz5gdSXmD0SlfOslokQg1YrrvEehmproimdfJA
        run: python update_sheets.py
